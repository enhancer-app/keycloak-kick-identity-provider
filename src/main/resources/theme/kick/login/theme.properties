#
# Optional login theme adding a Kick button icon.
#
# This theme is entirely opt-in. Installing the provider JAR does not change the appearance of
# any realm until an administrator selects "kick" as the realm's login theme
# (Realm settings -> Themes -> Login theme).
#
# It inherits everything from keycloak.v2 and only:
#   1. declares an icon class for the identity provider whose alias is "kick";
#   2. appends one stylesheet defining that class.
#
# If you already maintain a custom login theme, do not switch to this one. Copy the two
# non-comment lines below into your own theme.properties instead, along with the
# resources/css/kick-idp.css and resources/img/kick-idp-logo.svg files. See README.md.
#
# Upgrade note: the "styles" property is replaced, not merged, by Keycloak's theme inheritance,
# so the parent's own stylesheet (css/styles.css) has to be listed explicitly. If a future
# Keycloak release renames that file, this line must be updated. docs/COMPATIBILITY.md tracks it.
#
parent=keycloak.v2

styles=css/styles.css css/kick-idp.css

# Keycloak looks up "kcLogoIdP-<identity provider alias>". The default alias created by the
# Admin Console for this provider is "kick"; if you chose a different alias, add a matching
# line, e.g. kcLogoIdP-kick-prod=kc-social-kick
kcLogoIdP-kick=kc-social-kick
