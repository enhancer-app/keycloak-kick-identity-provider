name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew clean build --no-daemon
      - name: Upload provider JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-kick-identity-provider
          path: build/libs/keycloak-kick-identity-provider-*.jar
          if-no-files-found: error

  smoke:
    name: Keycloak provider discovery
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Run Keycloak discovery smoke test
        run: ./gradlew test -PwithSmoke --no-daemon
