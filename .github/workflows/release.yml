name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Build, unit test, and smoke test
        run: ./gradlew clean verify test -PwithSmoke --no-daemon -Pversion="${GITHUB_REF_NAME#v}"
      - name: Create SHA-256 checksum
        run: sha256sum build/libs/keycloak-kick-identity-provider-*.jar > build/libs/keycloak-kick-identity-provider.jar.sha256
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/keycloak-kick-identity-provider-*.jar
            build/libs/keycloak-kick-identity-provider-*-sources.jar
            build/libs/keycloak-kick-identity-provider-*-javadoc.jar
            build/libs/keycloak-kick-identity-provider.jar.sha256
